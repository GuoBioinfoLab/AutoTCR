# Matched original parameters of the published release.
# The complete executable configuration is src/autotcr/assets/inference_config.yaml.
sent_max_len: 32
dropout: 0.3
pooling_type: first-last-avg
batch_size: 64
tokenizer_kwargs:
  pad_token: "$"
  mask_token: "."
  unk_token: "?"
  sep_token: "|"
  cls_token: "*"
  do_lower_case: false
