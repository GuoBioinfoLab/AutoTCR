[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autotcr"
version = "1.1.0"
description = "Frozen sequence- and repertoire-level inference for AutoTCR"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Feiran Zeng"}]
keywords = ["T cell receptor", "autoimmune disease", "immune repertoire", "bioinformatics"]
classifiers = [
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = ["numpy>=1.24,<3", "pandas>=2.0,<3", "PyYAML>=6.0,<7"]

[project.optional-dependencies]
runtime = ["torch>=2.2,<3", "transformers==4.45.2", "huggingface-hub>=0.25,<1"]
dev = ["build>=1.2,<2", "ruff>=0.6,<1"]

[project.scripts]
autotcr = "autotcr.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
autotcr = ["licenses/*", "assets/*"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["tests/fixtures"]
[tool.ruff.lint]
select = ["F"]

